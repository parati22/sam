<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramo de Tulipanes Amarillos con Música</title>
  <style>
    *,
    *::after,
    *::before {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    :root {
      --dark-color: #000;
      --fl-speed: 0.8s;
      --speed-leaf: 2s;
    }

    body {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--dark-color);
      overflow: hidden;
      perspective: 1000px;
      font-family: 'Arial', sans-serif;
    }

    /* --- PANTALLA INICIAL: SOBRE / CARTA INTERACTIVA --- */
    .envelope-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1b1602 0%, #000000 85%);
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s;
    }

    .envelope-overlay.opened {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .envelope-box {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      border-radius: 20px;
      transition: transform 0.4s ease;
    }

    .envelope-box:hover {
      transform: scale(1.04);
    }

    .envelope-icon-wrapper {
      position: relative;
      width: 140px;
      height: 100px;
      background: linear-gradient(135deg, #ffd700, #ff9900);
      border-radius: 12px;
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.6), 0 10px 25px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
      border: 2px solid #fff59d;
      animation: pulseEnvelope 2.2s infinite ease-in-out;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 70px solid transparent;
      border-right: 70px solid transparent;
      border-top: 50px solid #ffe066;
      transform-origin: top;
      transition: transform 0.6s ease;
    }

    .envelope-wax {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff5252, #b71c1c);
      box-shadow: 0 0 14px rgba(255, 60, 60, 0.8), inset 0 0 6px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.1rem;
      top: 30px;
      z-index: 2;
    }

    .envelope-text {
      color: #fff8e1;
      font-size: clamp(1.15rem, 3.5vmin, 1.6rem);
      font-weight: bold;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.8);
      max-width: 340px;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .envelope-badge {
      display: inline-block;
      padding: 10px 24px;
      background: rgba(255, 215, 0, 0.15);
      border: 1.5px solid #ffd700;
      border-radius: 30px;
      color: #ffd700;
      font-size: clamp(0.9rem, 2.4vmin, 1.1rem);
      font-weight: bold;
      letter-spacing: 0.6px;
      box-shadow: 0 0 18px rgba(255, 215, 0, 0.4);
      animation: glowBadge 1.8s infinite ease-in-out;
    }

    @keyframes pulseEnvelope {
      0%, 100% {
        transform: translateY(0);
        box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
      }
      50% {
        transform: translateY(-8px);
        box-shadow: 0 0 50px rgba(255, 215, 0, 0.95);
      }
    }

    @keyframes glowBadge {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    /* --- FONDO NOCTURNO Y ESTRELLAS --- */
    .night {
      position: fixed;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 100%;
      height: 100%;
      filter: blur(0.1vmin);
      background-image: radial-gradient(
          ellipse at top,
          transparent 0%,
          var(--dark-color)
        ),
        radial-gradient(
          ellipse at bottom,
          var(--dark-color),
          rgba(145, 233, 255, 0.2)
        ),
        repeating-linear-gradient(
          220deg,
          rgb(0, 0, 0) 0px,
          rgb(0, 0, 0) 19px,
          transparent 19px,
          transparent 22px
        ),
        repeating-linear-gradient(
          189deg,
          rgb(0, 0, 0) 0px,
          rgb(0, 0, 0) 19px,
          transparent 19px,
          transparent 22px
        ),
        repeating-linear-gradient(
          148deg,
          rgb(0, 0, 0) 0px,
          rgb(0, 0, 0) 19px,
          transparent 19px,
          transparent 22px
        ),
        linear-gradient(90deg, rgb(0, 255, 250), rgb(240, 240, 240));
    }

    .shooting-stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .shooting-star {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.8);
      opacity: 0;
      animation: shootingStar 3s linear infinite;
    }

    .shooting-star::before {
      content: '';
      position: absolute;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 1) 100%);
      animation: shootingStarTail 3s linear infinite;
    }

    .shooting-star:nth-child(1) { top: 5%; left: -10%; animation-delay: 0s; animation-duration: 2.5s; }
    .shooting-star:nth-child(2) { top: 15%; left: -10%; animation-delay: 2s; animation-duration: 3s; }
    .shooting-star:nth-child(3) { top: 25%; left: -10%; animation-delay: 4s; animation-duration: 2.8s; }
    .shooting-star:nth-child(4) { top: 0%; left: -10%; animation-delay: 6s; animation-duration: 3.2s; }
    .shooting-star:nth-child(5) { top: 35%; left: -10%; animation-delay: 8s; animation-duration: 2.7s; }
    .shooting-star:nth-child(6) { top: 8%; left: -10%; animation-delay: 10s; animation-duration: 3.1s; }
    .shooting-star:nth-child(7) { top: 45%; left: -10%; animation-delay: 12s; animation-duration: 2.9s; }
    .shooting-star:nth-child(8) { top: 3%; left: -10%; animation-delay: 14s; animation-duration: 3.3s; }

    @keyframes shootingStar {
      0% { opacity: 0; transform: translateX(0) translateY(0) rotate(45deg); }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { opacity: 0; transform: translateX(120vw) translateY(50vh) rotate(10deg); }
    }

    @keyframes shootingStarTail {
      0% { width: 0; }
      30% { width: 100px; }
      100% { width: 0; }
    }

    .yellow-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .yellow-particle {
      position: absolute;
      width: 0.9vmin;
      height: 0.9vmin;
      border-radius: 50%;
      background: radial-gradient(circle, #fff6a8 0%, #ffd200 55%, #ffb300 100%);
      box-shadow: 0 0 1.2vmin rgba(255, 214, 51, 0.85);
      opacity: 0;
      animation: float-yellow-particle linear infinite;
    }

    @keyframes float-yellow-particle {
      0% { transform: translate3d(0, 2vh, 0) scale(0.8); opacity: 0; }
      10% { opacity: 0.95; }
      60% { opacity: 0.75; }
      100% { transform: translate3d(0, -112vh, 0) scale(1.35); opacity: 0; }
    }

    /* --- FLORES Y RAMO (BLOQUEO HASTA ABRIR EL SOBRE) --- */
    .flowers {
      position: relative;
      transform: scale(0.7);
      z-index: 2;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .app-started .flowers {
      opacity: 1;
    }

    /* Congelar animaciones antes de abrir el sobre para que broten progresivamente al hacer clic */
    body:not(.app-started) * {
      animation-play-state: paused !important;
    }

    .flower {
      position: absolute;
      bottom: 15vmin;
      transform-origin: bottom center;
      z-index: 50;
    }

    .flower--1 { animation: moving-flower-1 4s linear infinite; }
    .flower--1 .flower__line { height: 70vmin; animation-delay: 0.3s; }
    .flower--1 .flower__line__leaf--1 { animation: blooming-leaf-right var(--fl-speed) 1.6s backwards; }
    .flower--1 .flower__line__leaf--2 { animation: blooming-leaf-right var(--fl-speed) 1.4s backwards; }
    .flower--1 .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 1.2s backwards; }
    .flower--1 .flower__line__leaf--4 { animation: blooming-leaf-left var(--fl-speed) 1s backwards; }

    .flower--2 {
      left: 50%;
      transform: rotate(20deg);
      animation: moving-flower-2 4s linear infinite;
    }
    .flower--2 .flower__line { height: 60vmin; animation-delay: 0.6s; }
    .flower--2 .flower__line__leaf--1 { animation: blooming-leaf-right var(--fl-speed) 1.9s backwards; }
    .flower--2 .flower__line__leaf--2 { animation: blooming-leaf-right var(--fl-speed) 1.7s backwards; }
    .flower--2 .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 1.5s backwards; }
    .flower--2 .flower__line__leaf--4 { animation: blooming-leaf-left var(--fl-speed) 1.3s backwards; }

    .flower--3 {
      left: 50%;
      transform: rotate(-15deg);
      animation: moving-flower-3 4s linear infinite;
    }
    .flower--3 .flower__line { animation-delay: 0.9s; }
    .flower--3 .flower__line__leaf--1 { animation: blooming-leaf-right var(--fl-speed) 2.5s backwards; }
    .flower--3 .flower__line__leaf--2 { animation: blooming-leaf-right var(--fl-speed) 2.3s backwards; }
    .flower--3 .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 2.1s backwards; }
    .flower--3 .flower__line__leaf--4 { animation: blooming-leaf-left var(--fl-speed) 1.9s backwards; }

    .flower--4 {
      left: -25%;
      z-index: -6;
      transform: rotate(10deg);
      animation: moving-flower-4 3.5s linear infinite;
    }
    .flower--4 .flower__line { height: 90vmin; animation-delay: 1.2s; }
    .flower--4 .flower__line__leaf--1 { animation: blooming-leaf-right var(--fl-speed) 2.8s backwards; }
    .flower--4 .flower__line__leaf--2 { animation: blooming-leaf-right var(--fl-speed) 2.6s backwards; }
    .flower--4 .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 2.4s backwards; }
    .flower--4 .flower__line__leaf--4 { animation: blooming-leaf-left var(--fl-speed) 2.2s backwards; }

    .flower--5 {
      left: 75%;
      z-index: -7;
      transform: rotate(-25deg);
      animation: moving-flower-5 4.5s linear infinite;
    }
    .flower--5 .flower__line { height: 85vmin; animation-delay: 1.9s; }
    .flower--5 .flower__line__leaf--1 { animation: blooming-leaf-right var(--fl-speed) 2.7s backwards; }
    .flower--5 .flower__line__leaf--2 { animation: blooming-leaf-right var(--fl-speed) 2.5s backwards; }
    .flower--5 .flower__line__leaf--3 { animation: blooming-leaf-left var(--fl-speed) 2.3s backwards; }
    .flower--5 .flower__line__leaf--4 { animation: blooming-leaf-left var(--fl-speed) 2.1s backwards; }

    .flower__leafs {
      position: relative;
      animation: blooming-flower 2s backwards;
    }

    .flower__leafs--1 { animation-delay: 1.1s; }
    .flower__leafs--2 { animation-delay: 1.4s; }
    .flower__leafs--3 { animation-delay: 1.7s; }
    .flower__leafs--4 { animation-delay: 2.0s; }
    .flower__leafs--5 { animation-delay: 2.0s; }

    .flower__leafs::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -100%);
      width: 8vmin;
      height: 8vmin;
      background-color: #ffdd00;
      filter: blur(10vmin);
    }

    .flower__leaf {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 9vmin;
      height: 15vmin;
      background: radial-gradient(circle at 50% 20%, #ffffb0 0%, #ffd700 40%, #ff9900 100%);
      border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
      transform-origin: bottom center;
      opacity: 0.95;
      z-index: 2;
      border: 1.5px solid #ffcc33;
      box-shadow:
        0 0 1vmin #fff9c4,
        0 0 0.5vmin #ffd700,
        inset 0 0 1.5vmin rgba(255, 255, 255, 0.6);
    }

    .flower__leaf--1 { transform: translate(-50%, -5%) rotate(-22deg); z-index: 1; }
    .flower__leaf--2 { transform: translate(-50%, -5%) rotate(22deg); z-index: 1; }
    .flower__leaf--3 { transform: translate(-50%, -10%) rotate(0deg); z-index: 2; }

    .flower__leaf--4,
    .flower__leaf--5,
    .flower__leaf--6 {
      width: 7vmin;
      height: 12vmin;
      background: radial-gradient(circle at 50% 20%, #fff7a1 0%, #ffde4d 50%, #ff9900 100%);
      opacity: 0.9;
      border: 1px solid #ffdd55;
      border-radius: 50% 50% 45% 45% / 65% 65% 35% 35%;
      box-shadow:
        0 0 0.8vmin #fff9c4,
        inset 0 0 1vmin rgba(255, 255, 255, 0.5);
      z-index: 3;
    }

    .flower__leaf--4 { transform: translate(-50%, -8%) rotate(-10deg); }
    .flower__leaf--5 { transform: translate(-50%, -8%) rotate(10deg); }
    .flower__leaf--6 { transform: translate(-50%, -12%) rotate(0deg); }

    .flower__center {
      position: absolute;
      left: -2vmin;
      top: -2vmin;
      width: 4vmin;
      height: 4vmin;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffcc00 0%, #cc6600 80%, #fffde7 100%);
      border: 2px solid #ffe135;
      box-shadow:
        0 0 1vmin #fffde7,
        0 0 0.5vmin #ffd700,
        inset 0 0 1vmin #cc6600;
    }

    .flower__line {
      height: 55vmin;
      width: 2vmin;
      background-image: linear-gradient(
          to left,
          rgba(0, 0, 0, 0.3),
          transparent,
          rgba(255, 255, 255, 0.2)
        ),
        linear-gradient(to top, transparent 10%, #2d5016, #4a7c23, #6b8e23);
      box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.7);
      animation: grow-flower-tree 4s backwards;
    }

    .flower__line__leaf {
      --w: 8vmin;
      --h: calc(var(--w) + 3vmin);
      position: absolute;
      top: 20%;
      left: 90%;
      width: var(--w);
      height: var(--h);
      border-top-right-radius: var(--h);
      border-bottom-left-radius: var(--h);
      background-image: linear-gradient(
        to top,
        rgba(45, 80, 22, 0.6),
        #4a7c23,
        #6b8e23
      );
      box-shadow: inset 0 0 1vmin rgba(0, 0, 0, 0.3);
    }

    .flower__line__leaf--1 { transform: rotate(70deg) rotateY(30deg); }
    .flower__line__leaf--2 { top: 45%; transform: rotate(70deg) rotateY(30deg); }
    .flower__line__leaf--3,
    .flower__line__leaf--4 {
      border-top-right-radius: 0;
      border-bottom-left-radius: 0;
      border-top-left-radius: var(--h);
      border-bottom-right-radius: var(--h);
      left: -460%;
      top: 12%;
      transform: rotate(-70deg) rotateY(30deg);
    }
    .flower__line__leaf--4 { top: 40%; }

    .flower__light {
      position: absolute;
      bottom: 0vmin;
      width: 0.8vmin;
      height: 0.8vmin;
      background-color: #ffdd00;
      border-radius: 50%;
      filter: blur(0.1vmin);
      animation: tulip-light 6s linear infinite backwards;
      box-shadow: 0 0 1vmin rgba(255, 221, 0, 0.8);
    }

    .flower__light:nth-child(odd) { background-color: #ffaa00; }
    .flower__light--1 { left: -2vmin; animation-delay: 1s; }
    .flower__light--2 { left: 3vmin; animation-delay: 0.5s; }
    .flower__light--3 { left: -6vmin; animation-delay: 0.3s; }
    .flower__light--4 { left: 6vmin; animation-delay: 0.9s; }
    .flower__light--5 { left: -1vmin; animation-delay: 1.5s; }
    .flower__light--6 { left: -4vmin; animation-delay: 3s; }
    .flower__light--7 { left: 3vmin; animation-delay: 2s; }
    .flower__light--8 { left: -6vmin; animation-delay: 3.5s; }

    .flower__grass {
      --c: #4a7c23;
      --line-w: 2vmin;
      position: absolute;
      bottom: 12vmin;
      left: -7vmin;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      z-index: 20;
      transform-origin: bottom center;
      transform: rotate(-48deg) rotateY(40deg);
    }

    .flower__grass--1 { animation: moving-grass 2s linear infinite; }
    .flower__grass--2 {
      left: 2vmin;
      bottom: 10vmin;
      transform: scale(0.5) rotate(75deg) rotateX(10deg) rotateY(-200deg);
      opacity: 0.8;
      z-index: 0;
      animation: moving-grass--2 1.5s linear infinite;
    }
    .flower__grass--3 {
      left: -25vmin;
      bottom: 8vmin;
      transform: scale(0.7) rotate(-30deg) rotateY(45deg);
      opacity: 0.9;
      z-index: 15;
      animation: moving-grass--3 2.2s linear infinite;
    }
    .flower__grass--4 {
      left: -35vmin;
      bottom: 15vmin;
      transform: scale(0.4) rotate(60deg) rotateX(15deg) rotateY(-180deg);
      opacity: 0.7;
      z-index: 5;
      animation: moving-grass--4 1.8s linear infinite;
    }
    .flower__grass--5 {
      left: -18vmin;
      bottom: 6vmin;
      transform: scale(0.6) rotate(-60deg) rotateY(60deg);
      opacity: 0.85;
      z-index: 12;
      animation: moving-grass--5 2.5s linear infinite;
    }
    .flower__grass--6 {
      left: 25vmin;
      bottom: 9vmin;
      transform: scale(0.65) rotate(35deg) rotateY(-45deg);
      opacity: 0.9;
      z-index: 15;
      animation: moving-grass--6 2.3s linear infinite;
    }
    .flower__grass--7 {
      left: 35vmin;
      bottom: 14vmin;
      transform: scale(0.45) rotate(-70deg) rotateX(20deg) rotateY(170deg);
      opacity: 0.75;
      z-index: 8;
      animation: moving-grass--7 1.9s linear infinite;
    }
    .flower__grass--8 {
      left: 18vmin;
      bottom: 5vmin;
      transform: scale(0.55) rotate(50deg) rotateY(-70deg);
      opacity: 0.8;
      z-index: 10;
      animation: moving-grass--8 2.1s linear infinite;
    }
    .flower__grass--9 {
      left: -45vmin;
      bottom: 20vmin;
      transform: scale(0.3) rotate(20deg) rotateY(90deg);
      opacity: 0.6;
      z-index: 2;
      animation: moving-grass--9 1.6s linear infinite;
    }
    .flower__grass--10 {
      left: 42vmin;
      bottom: 18vmin;
      transform: scale(0.35) rotate(-45deg) rotateY(-120deg);
      opacity: 0.65;
      z-index: 3;
      animation: moving-grass--10 2.0s linear infinite;
    }

    .flower__grass--top {
      width: 7vmin;
      height: 10vmin;
      border-top-right-radius: 100%;
      border-right: var(--line-w) solid var(--c);
      transform-origin: bottom center;
      transform: rotate(-2deg);
    }

    .flower__grass--bottom {
      margin-top: -2px;
      width: var(--line-w);
      height: 25vmin;
      background-image: linear-gradient(to top, transparent, var(--c));
    }

    .flower__grass__leaf {
      --size: 10vmin;
      position: absolute;
      width: calc(var(--size) * 2.1);
      height: var(--size);
      border-top-left-radius: var(--size);
      border-top-right-radius: var(--size);
      background-image: linear-gradient(
        to top,
        transparent,
        transparent 30%,
        var(--c)
      );
      z-index: 100;
    }

    .flower__grass__leaf--1 { top: -6%; left: 30%; --size: 6vmin; transform: rotate(-20deg); animation: growing-grass-ans--1 var(--speed-leaf) 2.6s backwards; }
    .flower__grass__leaf--2 { top: -5%; left: -110%; --size: 6vmin; transform: rotate(10deg); animation: growing-grass-ans--2 var(--speed-leaf) 2.4s linear backwards; }
    .flower__grass__leaf--3 { top: 5%; left: 60%; --size: 8vmin; transform: rotate(-18deg) rotateX(-20deg); animation: growing-grass-ans--3 var(--speed-leaf) 2.2s linear backwards; }
    .flower__grass__leaf--4 { top: 6%; left: -135%; --size: 8vmin; transform: rotate(2deg); animation: growing-grass-ans--4 var(--speed-leaf) 2s linear backwards; }
    .flower__grass__leaf--5 { top: 20%; left: 60%; --size: 10vmin; transform: rotate(-24deg) rotateX(-20deg); animation: growing-grass-ans--5 var(--speed-leaf) 1.8s linear backwards; }
    .flower__grass__leaf--6 { top: 22%; left: -180%; --size: 10vmin; transform: rotate(10deg); animation: growing-grass-ans--6 var(--speed-leaf) 1.6s linear backwards; }
    .flower__grass__leaf--7 { top: 39%; left: 70%; --size: 10vmin; transform: rotate(-10deg); animation: growing-grass-ans--7 var(--speed-leaf) 1.4s linear backwards; }
    .flower__grass__leaf--8 { top: 40%; left: -215%; --size: 11vmin; transform: rotate(10deg); animation: growing-grass-ans--8 var(--speed-leaf) 1.2s linear backwards; }

    .flower__grass__overlay {
      position: absolute;
      top: -10%;
      right: 0%;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      filter: blur(1.5vmin);
      z-index: 100;
    }

    .special-text {
      position: fixed !important;
      top: max(0.75rem, 2.5vh) !important;
      left: 50%;
      transform: translateX(-50%);
      color: #ffdd00;
      font-size: clamp(1.2rem, 3.8vmin, 2.4rem);
      text-shadow: 0 0 0.4rem #000, 0 0 1.2vmin rgba(255, 221, 0, 0.85);
      z-index: 10000;
      text-align: center;
      width: min(92vw, 56rem);
      line-height: 1.25;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.8s ease 0.5s;
    }

    .app-started .special-text {
      opacity: 1;
    }

    .ramo {
      position: absolute;
      bottom: -22vmin;
      left: 50%;
      transform: translateX(-50%);
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s cubic-bezier(.4, 0, .2, 1);
    }

    .ramo--visible {
      opacity: 1;
    }

    .ramo img {
      width: 45vmin;
      height: auto;
      display: block;
    }

    .montes {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -10px;
      width: 100%;
      height: 60px;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      opacity: 0;
      transition: opacity 1.2s cubic-bezier(.4, 0, .2, 1);
      z-index: 1;
    }

    .ramo--visible .montes {
      opacity: 1;
    }

    .monte {
      display: block;
    }

    .monte-izq { margin-left: -30px; }
    .monte-der { margin-right: -30px; }

    /* --- BARRA DE AUDIO --- */
    .music-bar {
      position: fixed;
      left: 50%;
      bottom: 2.8vmin;
      transform: translateX(-50%);
      z-index: 30;
      width: min(92vw, 680px);
      padding: 1.2vmin 1.6vmin;
      border: 2px solid #ffd200;
      border-radius: 14px;
      background: rgba(10, 10, 10, 0.65);
      box-shadow:
        0 0 0.8vmin rgba(255, 210, 0, 0.95),
        0 0 2.4vmin rgba(255, 184, 0, 0.65),
        inset 0 0 0.8vmin rgba(255, 235, 140, 0.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      gap: 6px;
      opacity: 0;
      transition: opacity 1.2s ease 1s;
    }

    .app-started .music-bar {
      opacity: 1;
    }

    .music-title-track {
      font-size: clamp(0.75rem, 1.8vmin, 0.95rem);
      color: #ffe66d;
      font-weight: bold;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.7);
    }

    .music-bar audio {
      width: 100%;
      height: 42px;
      display: block;
      accent-color: #ffd200;
      border-radius: 10px;
      background: linear-gradient(90deg, #fff8a8 0%, #ffe45c 45%, #ffc300 100%);
      box-shadow: 0 0 0.6vmin rgba(255, 210, 0, 0.8);

      background: linear-gradient(90deg, #fff8a8 0%, #ffe45c 45%, #ffc300 100%);

    .music-bar audio::-webkit-media-controls-mute-button,

    @keyframes tulip-light {

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const envelopeBox = document.getElementById('envelopeBox');
      const envelopeOverlay = document.getElementById('envelopeOverlay');
      const envelopeFlap = document.getElementById('envelopeFlap');
      const audio = document.getElementById('bgAudio');

      let isOpened = false;

      function openEnvelope() {
        if (isOpened) return;
        isOpened = true;

        // 1. Abrir la solapa del sobre
        if (envelopeFlap) {
          envelopeFlap.style.transform = 'rotateX(180deg)';
        }

        // 2. Reproducir la música inmediatamente (aprovecha la interacción del clic)
        if (audio) {
          audio.play().catch(err => {
            console.log('Error de reproducción:', err);
          });
        }

        // 3. Desvanecer la pantalla inicial
        setTimeout(() => {
          envelopeOverlay.classList.add('opened');
          document.body.classList.remove('not-loaded');
          document.body.classList.add('app-started');

          // 4. Brote y animación progresiva del ramo
          setTimeout(() => {
            const ramo = document.querySelector('.ramo');
            if (ramo) ramo.classList.add('ramo--visible');
          }, 2400);
        }, 500);
      }

      if (envelopeBox) {
        envelopeBox.addEventListener('click', openEnvelope);
        envelopeBox.addEventListener('touchstart', (e) => {
          e.preventDefault();
          openEnvelope();
        });
      }
    });
  </script>
